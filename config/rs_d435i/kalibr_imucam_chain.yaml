%YAML:1.0

# =====================================================================
# RealSense D435i - stereo infrared (infra1 + infra2)
#
# !!! WARNING !!!
# The values below are TYPICAL SAMPLE VALUES for a D435i at 848x480,
# NOT those of your camera. You must replace them with real ones:
#
#   1) Quick (acceptable): take the factory calibration
#        rs-enumerate-devices -c
#   2) Accurate (recommended): Kalibr camera-IMU calibration
#        https://docs.openvins.com/gs-calibration.html
#
# IMPORTANT NOTE ON DISTORTION:
# The infra1/infra2 ".../image_rect_raw" topics are already RECTIFIED by
# the firmware, so distortion_coeffs = [0,0,0,0] is CORRECT.
# If you switch to the raw unrectified stream, fill the coefficients back in.
#
# The OpenVINS parser accepts both "T_cam_imu" and "T_imu_cam" and inverts
# automatically when needed (ov_core/src/utils/opencv_yaml_parse.h:529).
# Kalibr emits "T_cam_imu", so you can paste Kalibr's output straight in.
# =====================================================================

cam0:
  # infra1 = left IR imager. T_cam_imu: transform from IMU to camera.
  T_cam_imu:
    - [1.0, 0.0, 0.0, 0.0203127252531052]
    - [0.0, 1.0, 0.0, 0.0051032523624599]
    - [0.0, 0.0, 1.0, 0.0113000003620982]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [1]
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0] # already rectified -> zero
  distortion_model: radtan
  intrinsics: [425.0, 425.0, 424.0, 240.0] # fx, fy, cx, cy
  resolution: [848, 480]
  rostopic: /camera/camera/infra1/image_rect_raw
  timeshift_cam_imu: 0.0

cam1:
  # infra2 = right IR imager. Offset from cam0 equals exactly the BASELINE.
  # D435i baseline ~ 50mm (D455 ~ 95mm) -> this number is COMPLETELY different from the D455.
  T_cam_imu:
    - [1.0, 0.0, 0.0, -0.0296872747468948]
    - [0.0, 1.0, 0.0, 0.0051032523624599]
    - [0.0, 0.0, 1.0, 0.0113000003620982]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [0]
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [425.0, 425.0, 424.0, 240.0]
  resolution: [848, 480]
  rostopic: /camera/camera/infra2/image_rect_raw
  timeshift_cam_imu: 0.0
