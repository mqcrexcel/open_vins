%YAML:1.0

# =====================================================================
# RealSense D457 - stereo infrared (infra1 + infra2)
#
# !!! DAY LA GIA TRI MAU - PHAI THAY BANG GIA TRI THAT !!!
# D457 dung chung module quang D450 voi D455 nen baseline ~95mm va
# intrinsics tuong tu, nhung MOI MAY MOI KHAC. Bat buoc sinh lai:
#
#   # TAT driver ROS truoc (script can mo truc tiep camera)
#   python3 config/gen_realsense_calib.py -o config/rs_d457/kalibr_imucam_chain.yaml
#
# Muon chinh xac cao hon nua thi hieu chuan Kalibr:
#   https://docs.openvins.com/gs-calibration.html
# Factory calib KHONG do duoc goc lech xoay cam-IMU (luon tra ve ma tran
# don vi) va KHONG do duoc timeshift_cam_imu - hai thu nay chinh la
# nguyen nhan chinh gay troi quy dao.
#
# Luong ".../image_rect_raw" da duoc firmware rectify san nen
# distortion_coeffs = [0,0,0,0] la DUNG, khong phai bo sot.
#
# Parser cua OpenVINS chap nhan ca "T_cam_imu" lan "T_imu_cam" va tu
# nghich dao neu can (ov_core/src/utils/opencv_yaml_parse.h:529).
# =====================================================================

cam0:
  # infra1 = imager IR trai
  T_cam_imu:
    - [1.0, 0.0, 0.0, 0.0302200000733137]
    - [0.0, 1.0, 0.0, -0.0074000000022352]
    - [0.0, 0.0, 1.0, -0.0160199999809265]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [1]
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [433.3063659667969, 433.3063659667969, 428.8216857910156, 237.0122985839844] # fx, fy, cx, cy
  resolution: [848, 480]
  rostopic: /camera/camera/infra1/image_rect_raw
  timeshift_cam_imu: 0.0

cam1:
  # infra2 = imager IR phai. Baseline D457 ~ 95mm (giong D455,
  # KHAC hoan toan D435i von chi 50mm).
  T_cam_imu:
    - [1.0, 0.0, 0.0, -0.0648529008030891]
    - [0.0, 1.0, 0.0, -0.0074000000022352]
    - [0.0, 0.0, 1.0, -0.0160199999809265]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [0]
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [433.3063659667969, 433.3063659667969, 428.8216857910156, 237.0122985839844] # fx, fy, cx, cy
  resolution: [848, 480]
  rostopic: /camera/camera/infra2/image_rect_raw
  timeshift_cam_imu: 0.0
